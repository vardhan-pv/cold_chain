services:
  - type: web
    name: cold-chain-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.asgi:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: CC_ADMIN_TOKEN
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.0
